# Shared MkDocs config for the API docs of AYON repositories.
#
# The deploy workflows check this folder out to `.docs-setup/` inside the
# repository being built, and its `mkdocs.yml` inherits from this file:
#
#   INHERIT: .docs-setup/mkdocs/base.yml
#   site_name: ayon-houdini
#   repo_url: https://github.com/ynput/ayon-houdini
#   nav:
#     - Home: index.md
#     - License: license.md
#
# Paths below are relative to the repository root, not to this file.
# The logo, favicon and the AYON theme (css/ayon-theme.css, js/ayon-theme.js
# and partials/, styled after AYONpedia) come from `overrides/`; a file with
# the same path in the repository's `docs/` folder takes precedence.
#
# Options a repository can set in its `mkdocs.yml`; `hooks.py` handles them:
#
#   extra:
#     private: true              # hide repo link and source code
#     document_root_files: true  # document the Python files in the root
#     versions_to_keep: 15       # delete older versions after deploy
#                                # (cleanup_versions.py)

theme:
  name: material
  custom_dir: .docs-setup/mkdocs/overrides
  # The theme picker of AYONpedia and the AYON web app (overrides/partials/
  # palette.html): Dark (the default), Light and System. The icons are
  # Material Symbols names. Material resolves System through the `media` of
  # the Light and Dark entries, so keep those.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: dark_mode
        name: Dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: light_mode
        name: Light
    - media: "(prefers-color-scheme)"
      toggle:
        icon: computer
        name: System
  font:
    text: Inter
  icon:
    # AYONpedia's magnifier (Infima's), in overrides/.icons/ayon/
    search: ayon/search
  # css/ayon-theme.css swaps it for the black logo on the light scheme
  logo: img/AYON_docs_white.svg
  favicon: img/favicon.ico
  # No navigation.sections: sections collapse with a chevron, as on AYONpedia
  features:
    - navigation.path
    # Back-to-top button when scrolling up, styled like AYONpedia's in css/ayon-theme.css
    - navigation.top
    - navigation.prune

extra:
  # The AYON docs logo in the header leads to AYONpedia
  homepage: https://docs.ayon.dev/
  version:
    provider: mike

extra_css: [css/ayon-theme.css]
extra_javascript: [js/ayon-theme.js]

markdown_extensions:
  - mdx_gh_links
  - pymdownx.snippets
  # Mermaid diagrams in ```mermaid code blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - offline
  - mkdocs-autoapi:
      autoapi_dir: ./
      autoapi_add_nav_entry: Reference
      autoapi_ignore:
        - .*
        - docs/**/*
        - ./**/tests/**/*   # tests at any depth
        - tools/**/*
        - stubs/**/*        # mocha fix
        - ./**/pythonrc.py  # houdini fix
        - client/ayon_unreal/integration/**/*      # unreal fix
        - client/ayon_usd/ayon_bin_client/**/*.py  # usd fix
        - ./**/vendor/**/*                         # third party code
        - .*/**/*
        - ./*.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ./
            - client/*
            - server/*
            - services/*
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  - mike

hooks:
  - .docs-setup/mkdocs/hooks.py
