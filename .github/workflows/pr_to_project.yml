name: Auto assign pr
on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      project_id:
        type: string
        required: false
        default: ''
      pull_request_number:
        type: number
        required: true
    secrets:
      token:
        required: true

env:
  GH_TOKEN: ${{ secrets.token }}

jobs:
  auto-assign-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Verify Token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_TOKEN is not set"
            exit 1
          else
            echo "GH_TOKEN is set"
          fi

      - name: Assign PR to project
        env:
          PROJECT_ID: ${{ inputs.project_id != '' && inputs.project_id || '19' }}
        run: |
          gh project item-add "$PROJECT_ID" --owner ynput --url "$(gh pr view ${{ inputs.pull_request_number }} --json url -q '.url' --repo '${{ inputs.repo }}')"
